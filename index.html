const $=id=>document.getElementById(id);let muted=localStorage.raysMute==='1',AC,best=+localStorage.raysTriviaBest||0;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC}
function tone(f,type,d,v,t0=0){if(muted)return;const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d)}
const cowbell=(t=0)=>{tone(587,'square',.35,.15,t);tone(845,'square',.35,.12,t)};
const buzz=()=>{tone(110,'sawtooth',.45,.2);tone(116,'sawtooth',.45,.2)};
function upMute(){$('mute').textContent=muted?'🔕':'🔔'}upMute();
$('mute').onclick=()=>{muted=!muted;localStorage.raysMute=muted?'1':'0';upMute()};
const show=n=>[0,1,2].forEach(i=>$('s'+i).classList.toggle('on',i==n));
const upBest=()=>$('best').textContent='Best: '+best;upBest();
// confetti
const cv=$('cf'),cx=cv.getContext('2d');let parts=[],raf=0;
function confetti(){cv.width=innerWidth;cv.height=innerHeight;const C=['#F5D130','#8FBCE6','#fff','#092C5C'];for(let k=0;k<70;k++)parts.push({x:cv.width/2,y:cv.height*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+3,c:C[k%4],a:Math.random()*6,l:90});if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.a+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}
// no-repeat draw
function getSeen(){try{return new Set(JSON.parse(localStorage.raysSeen||'[]'))}catch(e){return new Set}}
const shuf=a=>{for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
function draw(){let seen=getSeen();const valid=new Set(Q.map(q=>q[0]));seen=new Set([...seen].filter(t=>valid.has(t)));let fresh=shuf(Q.filter(q=>!seen.has(q[0])));
if(fresh.length<10){const extra=shuf(Q.filter(q=>seen.has(q[0])));seen=new Set();const pick=fresh.concat(extra.slice(0,10-fresh.length));pick.forEach(q=>seen.add(q[0]));localStorage.raysSeen=JSON.stringify([...seen]);return pick}
const pick=fresh.slice(0,10);pick.forEach(q=>seen.add(q[0]));localStorage.raysSeen=JSON.stringify([...seen]);return pick}
function upPool(){const s=getSeen();$('pool').textContent=Q.length+' questions · '+Math.max(0,Q.length-s.size)+' you haven\'t seen yet'}upPool();
let rank,set,i,score,streak,maxS,correct,timer,t0,locked,res,saved;
function start(){ac();set=draw();i=score=streak=maxS=correct=0;res=[];saved=false;show(1);ask()}
function ask(){const[q,o,a,f]=set[i];locked=false;$('qn').textContent=(i+1)+'/10';$('sc').textContent=score;$('st').textContent=streak;$('q').textContent=q;$('fact').style.visibility='hidden';$('next').style.visibility='hidden';
const ord=o.map((x,k)=>k).sort(()=>Math.random()-.5);$('opts').innerHTML='';
ord.forEach(k=>{const b=document.createElement('button');b.className='opt';b.textContent=o[k];b.dataset.k=k;b.onclick=()=>pick(k);$('opts').appendChild(b)});
t0=performance.now();cancelAnimationFrame(timer);tick()}
function tick(){const left=15-(performance.now()-t0)/1000;$('tb').style.width=Math.max(0,left/15*100)+'%';$('tb').style.background=left<5?'#e0464b':'#F5D130';if(left<=0)return pick(-1);timer=requestAnimationFrame(tick)}
function pick(k){if(locked)return;locked=true;cancelAnimationFrame(timer);const[,,a,f]=set[i],left=Math.max(0,15-(performance.now()-t0)/1000);
[...$('opts').children].forEach(b=>{if(+b.dataset.k===a)b.classList.add('ok');else if(+b.dataset.k===k)b.classList.add('bad')});
if(k===a){streak++;correct++;maxS=Math.max(maxS,streak);const mult=1+Math.min(streak-1,4)*.25;score+=Math.round((100+left/15*100)*mult);cowbell();if(streak>=3)cowbell(.18);confetti();res.push('🟩')}else{streak=0;buzz();res.push(k<0?'⏰':'🟥')}
$('sc').textContent=score;$('st').textContent=streak;$('fact').textContent=(k===a?'✅ ':k<0?'⏰ Time\'s up! ':'❌ ')+f;$('fact').style.visibility='visible';$('next').textContent=i<9?'Next ▶':'See Results';$('next').style.visibility='visible'}
function next(){if(++i<10)ask();else end()}
function getLB(){try{return JSON.parse(localStorage.raysLB||'[]')}catch(e){return[]}}
function drawLB(hi){const L=getLB();$('lbl').innerHTML=L.length?'':'<li class="muted">No saved scores yet</li>';L.forEach((e,k)=>{const li=document.createElement('li');li.textContent=e.n+' — '+e.s+' pts ('+e.c+'/10)';if(k===hi)li.className='me';$('lbl').appendChild(li)})}
function end(){show(2);$('fs').textContent=score;$('fc').textContent=correct+'/10';$('fb').textContent=maxS;$('grid').textContent=res.join('');
const R=[[10,'🏆','Hall of Rays','Devil Ray Legend. Somewhere Don Zimmer is tipping his cap.'],[8,'⭐','Rays Expert','You could run the front office on a $60M payroll.'],[6,'🔥','Rays Up Diehard','Season-ticket energy. Your cowbell has dents.'],[4,'🔔','Trop Regular','You know the cowbell. You know the catwalks. Mostly.'],[2,'🚌','Bandwagoner','Only shows up for playoff games, huh?'],[0,'🗽','Certified Yankee','Did you take a wrong turn off Dale Mabry? Pinstripes detected.']];
rank=R.find(r=>correct>=r[0]);$('rating').innerHTML='<div style="font-size:56px">'+rank[1]+'</div><div style="font-size:30px">'+rank[2]+'</div><div class="muted" style="font-size:16px;font-weight:600">'+rank[3]+'</div>';
if(score>best){best=score;localStorage.raysTriviaBest=best;$('rating').insertAdjacentHTML('beforeend','<div>NEW BEST!</div>');[0,.2,.4].forEach(cowbell);confetti()}upBest();$('fbest').textContent=best;
$('nm').value=localStorage.raysName||'';$('nameRow').style.display='flex';drawLB(-1);upPool()}
$('save').onclick=()=>{if(saved)return;const n=($('nm').value.trim()||'Player').slice(0,14);localStorage.raysName=n;const e={n,s:score,c:correct,t:Date.now()};const L=getLB();L.push(e);L.sort((x,y)=>y.s-x.s);const top=L.slice(0,10);localStorage.raysLB=JSON.stringify(top);saved=true;$('nameRow').style.display='none';drawLB(top.indexOf(top.find(x=>x.t===e.t)))};
$('share').onclick=async()=>{const url=location.href.split('#')[0].split('?')[0];const text='I scored '+correct+'/10 ('+score+' pts) on Rays Trivia ⚾ — '+rank[1]+' '+rank[2]+'\n'+res.join('')+'\nBeat me: '+url;
try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e.name==='AbortError')return}
try{await navigator.clipboard.writeText(text);$('share').textContent='Copied! ✅'}catch(e){prompt('Copy this:',text)}setTimeout(()=>$('share').textContent='Share 📤',2000)};
$('go').onclick=start;$('again').onclick=start;$('next').onclick=next;
</script></body></html>
